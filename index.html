<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acqua</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#38bdf8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Acqua">
<script src="lib/xlsx.full.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER con icona SVG goccia piena -->
<div class="header">
  <svg class="header-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
      </linearGradient>
    </defs>
    <path d="M50 10 C50 10 18 45 18 63 C18 81 32 92 50 92 C68 92 82 81 82 63 C82 45 50 10 50 10 Z"
      fill="url(#dropGrad)" stroke="#0ea5e9" stroke-width="2"/>
    <ellipse cx="38" cy="48" rx="6" ry="10" fill="rgba(255,255,255,0.25)" transform="rotate(-20 38 48)"/>
  </svg>
  <h1>Acqua</h1>
  <p>Tracker idratazione · con orario</p>
</div>

<!-- DATA -->
<div class="card">
  <span class="card-label">Giorno selezionato</span>
  <input type="date" id="dateInput" />
  <p class="date-label" id="dateLabel"></p>
</div>

<!-- AGGIUNGI -->
<div class="card">
  <span class="card-label">Aggiungi assunzione</span>
  <div class="form-grid">
    <div class="form-field">
      <label>Orario</label>
      <input type="time" id="timeInput" />
    </div>
    <div class="form-field">
      <label>Dimensione (ml)</label>
      <select id="sizeSelect">
        <option value="100">100 ml</option>
        <option value="150">150 ml</option>
        <option value="200" selected>200 ml</option>
        <option value="250">250 ml</option>
        <option value="300">300 ml</option>
        <option value="350">350 ml</option>
        <option value="400">400 ml</option>
        <option value="500">500 ml</option>
      </select>
    </div>
  </div>
  <div class="form-field" style="margin-bottom:10px;">
    <label>Numero bicchieri</label>
    <div class="qty-row">
      <button class="qty-btn" id="qtyMinus">−</button>
      <span class="qty-num" id="qtyNum">1</span>
      <button class="qty-btn" id="qtyPlus">+</button>
      <span style="font-size:13px;color:#64748b;margin-left:4px;" id="qtyMl">= 200 ml</span>
    </div>
  </div>
  <input class="note-input" type="text" id="noteInput" placeholder="Nota opzionale (es. dopo allenamento)..." maxlength="60" />
  <button class="add-btn" id="addBtn">+ Aggiungi</button>
</div>

<!-- TIMELINE -->
<div class="card">
  <span class="card-label">Timeline del giorno</span>
  <div class="timeline" id="timeline">
    <div class="empty-timeline">💧 Nessuna assunzione registrata</div>
  </div>
</div>

<!-- PROGRESSO -->
<div class="card">
  <div class="progress-header">
    <span>Totale giornaliero</span>
    <span id="progressText" style="font-weight:700;color:#e2e8f0;"></span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill"></div>
  </div>
  <div class="progress-status" id="progressStatus"></div>
  <div class="stats-grid">
    <div class="stat-box"><div class="stat-value" id="statEntries">0</div><div class="stat-label">Assunzioni</div></div>
    <div class="stat-box"><div class="stat-value" id="statGlasses">0</div><div class="stat-label">Bicchieri totali</div></div>
    <div class="stat-box"><div class="stat-value" id="statFirst">—</div><div class="stat-label">Prima assunzione</div></div>
    <div class="stat-box"><div class="stat-value" id="statLast">—</div><div class="stat-label">Ultima assunzione</div></div>
  </div>
</div>

<!-- STORICO -->
<button class="toggle-btn" id="toggleBtn">▼ Mostra storico</button>
<div id="history-section">
  <div class="card" style="padding:0;overflow:hidden;">
    <div id="historyList"></div>
  </div>
</div>

<!-- EXPORT / IMPORT -->
<div class="btn-row" id="exportRow" style="display:none;">
  <button class="export-btn" id="exportBtn">📥 Esporta Excel</button>
  <button class="import-btn" id="importBtnMain">📤 Importa Excel</button>
</div>
<div id="importOnlyRow" style="margin-top:4px;">
  <button class="import-btn" id="importBtnOnly" style="width:100%;padding:16px;">📤 Importa Excel</button>
</div>

<input type="file" id="importFileInput" accept=".xlsx,.xls" />

<div class="toast" id="toast"></div>

<script src="js/storage.js"></script>
<script src="js/water.js"></script>
<script src="js/backup.js"></script>
<script src="js/main.js"></script>
</body>
</html>
