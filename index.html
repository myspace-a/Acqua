<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acqua</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#38bdf8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Acqua">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #0d1117 0%, #0a2540 60%, #0d1117 100%);
    font-family: 'Trebuchet MS', sans-serif;
    color: #e2e8f0;
    padding: 24px 16px 60px;
  }
  .header { text-align: center; margin-bottom: 28px; }
  .header-icon { width: 64px; height: 64px; margin: 0 auto 8px; display: block; }
  .header h1 {
    font-size: 28px; font-weight: 800;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 2px; text-transform: uppercase; margin: 4px 0 2px;
  }
  .header p { color: #475569; font-size: 13px; }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(125,211,252,0.12);
    border-radius: 18px; padding: 18px; margin-bottom: 16px;
  }
  .card-label {
    font-size: 10px; color: #7dd3fc;
    letter-spacing: 3px; text-transform: uppercase;
    display: block; margin-bottom: 14px;
  }
  input[type="date"], input[type="time"] {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(125,211,252,0.25);
    border-radius: 10px; color: #e2e8f0;
    padding: 10px 14px; font-size: 15px; outline: none; width: 100%;
  }
  .date-label { font-size: 13px; color: #64748b; margin-top: 8px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .form-field label {
    font-size: 11px; color: #94a3b8;
    letter-spacing: 1px; text-transform: uppercase;
    display: block; margin-bottom: 6px;
  }
  select {
    width: 100%; background: rgba(255,255,255,0.07);
    border: 1px solid rgba(125,211,252,0.25);
    border-radius: 10px; color: #e2e8f0;
    padding: 10px 14px; font-size: 15px; outline: none; appearance: none;
  }
  .qty-row { display: flex; align-items: center; gap: 10px; }
  .qty-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 2px solid rgba(125,211,252,0.4);
    background: rgba(125,211,252,0.08); color: #7dd3fc;
    font-size: 20px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0;
  }
  .qty-num { font-size: 22px; font-weight: 800; color: #7dd3fc; min-width: 32px; text-align: center; }
  .note-input {
    width: 100%; background: rgba(255,255,255,0.07);
    border: 1px solid rgba(125,211,252,0.25);
    border-radius: 10px; color: #e2e8f0;
    padding: 10px 14px; font-size: 14px; outline: none;
    margin-bottom: 14px; font-family: inherit;
  }
  .note-input::placeholder { color: #475569; }
  .add-btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #1d4ed8, #3b82f6);
    border: none; border-radius: 12px; color: #fff;
    font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: 1px;
    box-shadow: 0 4px 16px rgba(59,130,246,0.35); transition: opacity 0.2s;
  }
  .add-btn:active { opacity: 0.8; }
  .timeline { position: relative; padding-left: 20px; }
  .timeline::before {
    content: ''; position: absolute; left: 7px; top: 8px; bottom: 8px;
    width: 2px; background: rgba(125,211,252,0.15); border-radius: 2px;
  }
  .tl-item {
    position: relative; margin-bottom: 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px; padding: 12px 14px; transition: border-color 0.2s;
  }
  .tl-item:last-child { margin-bottom: 0; }
  .tl-item:hover { border-color: rgba(125,211,252,0.25); }
  .tl-dot {
    position: absolute; left: -23px; top: 14px;
    width: 12px; height: 12px; border-radius: 50%;
    background: #38bdf8; border: 2px solid #0a2540;
    box-shadow: 0 0 8px rgba(56,189,248,0.5);
  }
  .tl-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .tl-time { font-size: 18px; font-weight: 800; color: #38bdf8; line-height: 1; }
  .tl-right { text-align: right; }
  .tl-ml { font-size: 16px; font-weight: 700; color: #e2e8f0; }
  .tl-detail { font-size: 12px; color: #64748b; margin-top: 2px; }
  .tl-note { font-size: 12px; color: #94a3b8; margin-top: 6px; font-style: italic; }
  .tl-delete {
    position: absolute; top: 10px; right: 10px;
    background: rgba(248,113,113,0.15); border: 1px solid rgba(248,113,113,0.3);
    border-radius: 6px; color: #f87171; font-size: 12px; cursor: pointer; padding: 2px 8px;
  }
  .empty-timeline { text-align: center; color: #475569; font-size: 14px; padding: 20px 0; }
  .progress-header { display: flex; justify-content: space-between; font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
  .progress-bar-bg { background: rgba(255,255,255,0.07); border-radius: 100px; height: 14px; overflow: hidden; }
  .progress-bar-fill { height: 100%; border-radius: 100px; transition: width 0.4s ease; }
  .progress-status { text-align: right; font-size: 13px; margin-top: 6px; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.07); }
  .stat-box { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.07); }
  .stat-value { font-size: 22px; font-weight: 800; color: #7dd3fc; }
  .stat-label { font-size: 11px; color: #64748b; margin-top: 2px; letter-spacing: 1px; }
  .toggle-btn {
    width: 100%; padding: 14px;
    background: rgba(125,211,252,0.06); border: 1px solid rgba(125,211,252,0.2);
    border-radius: 12px; color: #7dd3fc; font-size: 14px; cursor: pointer;
    margin-bottom: 12px; letter-spacing: 1px;
  }
  .history-item { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
  .history-item:last-child { border-bottom: none; }
  .history-item.selected { background: rgba(125,211,252,0.07); }
  .history-top { display: flex; justify-content: space-between; align-items: center; }
  .history-date { font-size: 14px; color: #e2e8f0; }
  .history-total { font-size: 15px; font-weight: 700; }
  .history-detail { font-size: 12px; color: #64748b; margin-top: 3px; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .export-btn {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #0ea5e9, #38bdf8);
    border: none; border-radius: 14px; color: #0f172a;
    font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: 1px;
    box-shadow: 0 4px 20px rgba(14,165,233,0.35);
  }
  .import-btn {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #059669, #34d399);
    border: none; border-radius: 14px; color: #0f172a;
    font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: 1px;
    box-shadow: 0 4px 20px rgba(52,211,153,0.35);
  }
  /* Toast */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #1e293b; border: 1px solid rgba(125,211,252,0.3);
    color: #e2e8f0; padding: 12px 24px; border-radius: 50px;
    font-size: 14px; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; z-index: 999; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  #history-section { display: none; }
  #importFileInput { display: none; }
</style>
</head>
<body>

<!-- HEADER con icona SVG goccia piena -->
<div class="header">
  <svg class="header-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
      </linearGradient>
    </defs>
    <path d="M50 10 C50 10 18 45 18 63 C18 81 32 92 50 92 C68 92 82 81 82 63 C82 45 50 10 50 10 Z"
      fill="url(#dropGrad)" stroke="#0ea5e9" stroke-width="2"/>
    <ellipse cx="38" cy="48" rx="6" ry="10" fill="rgba(255,255,255,0.25)" transform="rotate(-20 38 48)"/>
  </svg>
  <h1>Acqua</h1>
  <p>Tracker idratazione · con orario</p>
</div>

<!-- DATA -->
<div class="card">
  <span class="card-label">Giorno selezionato</span>
  <input type="date" id="dateInput" />
  <p class="date-label" id="dateLabel"></p>
</div>

<!-- AGGIUNGI -->
<div class="card">
  <span class="card-label">Aggiungi assunzione</span>
  <div class="form-grid">
    <div class="form-field">
      <label>Orario</label>
      <input type="time" id="timeInput" />
    </div>
    <div class="form-field">
      <label>Dimensione (ml)</label>
      <select id="sizeSelect">
        <option value="100">100 ml</option>
        <option value="150">150 ml</option>
        <option value="200" selected>200 ml</option>
        <option value="250">250 ml</option>
        <option value="300">300 ml</option>
        <option value="350">350 ml</option>
        <option value="400">400 ml</option>
        <option value="500">500 ml</option>
      </select>
    </div>
  </div>
  <div class="form-field" style="margin-bottom:10px;">
    <label>Numero bicchieri</label>
    <div class="qty-row">
      <button class="qty-btn" id="qtyMinus">−</button>
      <span class="qty-num" id="qtyNum">1</span>
      <button class="qty-btn" id="qtyPlus">+</button>
      <span style="font-size:13px;color:#64748b;margin-left:4px;" id="qtyMl">= 200 ml</span>
    </div>
  </div>
  <input class="note-input" type="text" id="noteInput" placeholder="Nota opzionale (es. dopo allenamento)..." maxlength="60" />
  <button class="add-btn" id="addBtn">+ Aggiungi</button>
</div>

<!-- TIMELINE -->
<div class="card">
  <span class="card-label">Timeline del giorno</span>
  <div class="timeline" id="timeline">
    <div class="empty-timeline">💧 Nessuna assunzione registrata</div>
  </div>
</div>

<!-- PROGRESSO -->
<div class="card">
  <div class="progress-header">
    <span>Totale giornaliero</span>
    <span id="progressText" style="font-weight:700;color:#e2e8f0;"></span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill"></div>
  </div>
  <div class="progress-status" id="progressStatus"></div>
  <div class="stats-grid">
    <div class="stat-box"><div class="stat-value" id="statEntries">0</div><div class="stat-label">Assunzioni</div></div>
    <div class="stat-box"><div class="stat-value" id="statGlasses">0</div><div class="stat-label">Bicchieri totali</div></div>
    <div class="stat-box"><div class="stat-value" id="statFirst">—</div><div class="stat-label">Prima assunzione</div></div>
    <div class="stat-box"><div class="stat-value" id="statLast">—</div><div class="stat-label">Ultima assunzione</div></div>
  </div>
</div>

<!-- STORICO -->
<button class="toggle-btn" id="toggleBtn">▼ Mostra storico</button>
<div id="history-section">
  <div class="card" style="padding:0;overflow:hidden;">
    <div id="historyList"></div>
  </div>
</div>

<!-- EXPORT / IMPORT -->
<div class="btn-row" id="exportRow" style="display:none;">
  <button class="export-btn" id="exportBtn">📥 Esporta Excel</button>
  <button class="import-btn" id="importBtnMain">📤 Importa Excel</button>
</div>
<div id="importOnlyRow" style="margin-top:4px;">
  <button class="import-btn" id="importBtnOnly" style="width:100%;padding:16px;">📤 Importa Excel</button>
</div>

<input type="file" id="importFileInput" accept=".xlsx,.xls" />

<div class="toast" id="toast"></div>

<script>
const GOAL = 2000;
let data = {};
let selectedDate = '';
let formQty = 1;

function sanitize(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function showToast(msg, duration = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}
function getTodayKey() {
  return new Date().toISOString().split('T')[0];
}
function getNowTime() {
  const now = new Date();
  return `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
}
function formatDate(dateKey) {
  const [y,m,d] = dateKey.split('-');
  return new Date(y,m-1,d).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

// Converte "lunedì 16 marzo 2026" → "2026-03-16"
function parseDateKey(formatted) {
  try {
    const months = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
    const parts = formatted.toLowerCase().replace(/[,]/g,'').split(' ').filter(p => p.trim());
    // cerca numero giorno, mese testuale, anno
    let day, month, year;
    for (let i = 0; i < parts.length; i++) {
      const n = parseInt(parts[i]);
      if (!isNaN(n) && n >= 1 && n <= 31 && !day) day = n;
      else if (!isNaN(n) && n >= 2000) year = n;
      else {
        const mi = months.indexOf(parts[i]);
        if (mi !== -1) month = mi + 1;
      }
    }
    if (day && month && year) {
      return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    }
  } catch {}
  return null;
}

function loadData() {
  try { data = JSON.parse(localStorage.getItem('water-tracker-v2-timed') || '{}'); } catch { data = {}; }
}
function saveData() {
  try { localStorage.setItem('water-tracker-v2-timed', JSON.stringify(data)); } catch {}
}
function getDayEntries() {
  return (data[selectedDate] || []).slice().sort((a,b) => a.time.localeCompare(b.time));
}
function calcTotal(entries) {
  return entries.reduce((s,e) => s + e.size * e.qty, 0);
}
function changeQty(delta) {
  formQty = Math.max(1, Math.min(20, formQty + delta));
  document.getElementById('qtyNum').textContent = formQty;
  updateQtyMl();
}
function updateQtyMl() {
  const size = parseInt(document.getElementById('sizeSelect').value);
  document.getElementById('qtyMl').textContent = `= ${size * formQty} ml`;
}
function addEntry() {
  const time = document.getElementById('timeInput').value;
  const size = parseInt(document.getElementById('sizeSelect').value);
  const note = document.getElementById('noteInput').value.trim();
  if (!time) { alert("Inserisci l'orario!"); return; }
  if (!data[selectedDate]) data[selectedDate] = [];
  data[selectedDate].push({ time, size, qty: formQty, note });
  saveData();
  document.getElementById('noteInput').value = '';
  render();
}
function deleteEntry(index) {
  const entries = getDayEntries();
  const entry = entries[index];
  const orig = data[selectedDate];
  const i = orig.findIndex(e => e.time === entry.time && e.size === entry.size && e.qty === entry.qty && e.note === entry.note);
  if (i !== -1) orig.splice(i, 1);
  if (orig.length === 0) delete data[selectedDate];
  saveData();
  render();
}
function render() {
  renderTimeline();
  renderProgress();
  renderHistory();
  updateBtns();
}
function renderTimeline() {
  const entries = getDayEntries();
  const tl = document.getElementById('timeline');
  if (!entries.length) {
    tl.innerHTML = '<div class="empty-timeline">💧 Nessuna assunzione registrata</div>';
    return;
  }
  tl.innerHTML = entries.map((e, i) => `
    <div class="tl-item">
      <div class="tl-dot"></div>
      <button class="tl-delete" data-index="${i}">✕</button>
      <div class="tl-header">
        <div class="tl-time">${e.time}</div>
        <div class="tl-right">
          <div class="tl-ml">${e.size * e.qty} ml</div>
          <div class="tl-detail">${e.qty} × ${e.size} ml</div>
        </div>
      </div>
      ${e.note ? `<div class="tl-note">📝 ${sanitize(e.note)}</div>` : ''}
    </div>
  `).join('');
}
function renderProgress() {
  const entries = getDayEntries();
  const total = calcTotal(entries);
  const pct = Math.min(100, (total / GOAL) * 100);
  const color = pct < 40 ? '#f87171' : pct < 70 ? '#fbbf24' : '#34d399';
  document.getElementById('progressText').textContent = `${total} ml / ${GOAL} ml`;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressFill').style.background = `linear-gradient(90deg, ${color}, ${color}bb)`;
  document.getElementById('progressStatus').style.color = pct >= 100 ? '#34d399' : '#64748b';
  document.getElementById('progressStatus').textContent = pct >= 100
    ? '🎉 Obiettivo raggiunto!'
    : `${Math.round(pct)}% dell'obiettivo (${GOAL} ml)`;
  const totalGlasses = entries.reduce((s,e) => s + e.qty, 0);
  document.getElementById('statEntries').textContent = entries.length;
  document.getElementById('statGlasses').textContent = totalGlasses;
  document.getElementById('statFirst').textContent = entries.length ? entries[0].time : '—';
  document.getElementById('statLast').textContent = entries.length ? entries[entries.length-1].time : '—';
}
function renderHistory() {
  const sorted = Object.keys(data).sort((a,b) => b.localeCompare(a));
  const list = document.getElementById('historyList');
  if (!sorted.length) { list.innerHTML = ''; return; }
  list.innerHTML = sorted.map(date => {
    const entries = (data[date] || []).slice().sort((a,b) => a.time.localeCompare(b.time));
    const total = calcTotal(entries);
    const color = total >= GOAL ? '#34d399' : '#94a3b8';
    const detail = `${entries.length} assunzioni · ${entries.reduce((s,e)=>s+e.qty,0)} bicchieri`;
    return `<div class="history-item ${date === selectedDate ? 'selected' : ''}" data-date="${date}">
      <div class="history-top">
        <div class="history-date">${formatDate(date)}</div>
        <div class="history-total" style="color:${color}">${total} ml</div>
      </div>
      <div class="history-detail">${detail}</div>
    </div>`;
  }).join('');
}
function updateBtns() {
  const has = Object.keys(data).length > 0;
  document.getElementById('exportRow').style.display = has ? 'grid' : 'none';
  document.getElementById('importOnlyRow').style.display = has ? 'none' : 'block';
}
function selectDay(date) {
  selectedDate = date;
  document.getElementById('dateInput').value = date;
  document.getElementById('dateLabel').textContent = formatDate(date);
  render();
}
function toggleHistory() {
  const sec = document.getElementById('history-section');
  const visible = sec.style.display === 'block';
  sec.style.display = visible ? 'none' : 'block';
  document.getElementById('toggleBtn').textContent = visible ? '▼ Mostra storico' : '▲ Nascondi storico';
}

// ── EXPORT ──
function exportExcel() {
  const sorted = Object.keys(data).sort((a,b) => b.localeCompare(a));
  const rows = [];
  sorted.forEach(date => {
    const entries = (data[date] || []).slice().sort((a,b) => a.time.localeCompare(b.time));
    entries.forEach(e => {
      rows.push({
        'Data': formatDate(date),
        'Orario': e.time,
        'Bicchieri': e.qty,
        'Dimensione (ml)': e.size,
        'Totale assunzione (ml)': e.size * e.qty,
        'Nota': e.note || '',
      });
    });
    rows.push({ 'Data': '', 'Orario': '', 'Bicchieri': '', 'Dimensione (ml)': 'TOTALE GIORNO', 'Totale assunzione (ml)': calcTotal(entries), 'Nota': '' });
    rows.push({});
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:32},{wch:10},{wch:10},{wch:16},{wch:22},{wch:30}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Idratazione');
  XLSX.writeFile(wb, 'acqua-backup.xlsx');
  showToast('✅ Esportazione completata!');
}

// ── IMPORT ──
const VALID_SIZES = [100, 150, 200, 250, 300, 350, 400, 500];
const MAX_FILE_SIZE = 2 * 1024 * 1024; // 2MB max
const TIME_REGEX = /^([01]\d|2[0-3]):([0-5]\d)$/;

function importExcel(event) {
  const file = event.target.files[0];
  if (!file) return;

  // Limite dimensione file
  if (file.size > MAX_FILE_SIZE) {
    showToast('❌ File troppo grande (max 2MB)', 4000);
    event.target.value = '';
    return;
  }

  // Verifica estensione
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['xlsx','xls'].includes(ext)) {
    showToast('❌ Formato file non valido', 4000);
    event.target.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });

      // Limite numero righe
      if (rows.length > 10000) {
        showToast('❌ File con troppi dati (max 10.000 righe)', 4000);
        return;
      }

      let imported = 0;
      let skipped = 0;
      let currentDateKey = null;

      rows.forEach(row => {
        const dataVal = (row['Data'] || '').toString().trim().substring(0, 60);
        const orario  = (row['Orario'] || '').toString().trim().substring(0, 5);
        const bicchieri = parseInt(row['Bicchieri']);
        const dimensione = parseInt(row['Dimensione (ml)']);
        const nota = (row['Nota'] || '').toString().trim().substring(0, 60); // tronca a 60 chars

        // Riga totale o riga vuota → skip
        if (!dataVal || row['Dimensione (ml)'] === 'TOTALE GIORNO' || (!orario && !bicchieri)) return;

        // Risolvi la data
        if (dataVal) {
          const parsed = parseDateKey(dataVal);
          if (parsed) currentDateKey = parsed;
        }
        if (!currentDateKey) { skipped++; return; }

        // Valida orario con regex HH:MM
        if (!TIME_REGEX.test(orario)) { skipped++; return; }

        // Valida numeri con limiti sensati
        if (isNaN(bicchieri) || isNaN(dimensione) ||
            bicchieri <= 0 || bicchieri > 20 ||
            !VALID_SIZES.includes(dimensione)) {
          skipped++;
          return;
        }

        // Aggiungi senza duplicati
        if (!data[currentDateKey]) data[currentDateKey] = [];
        const exists = data[currentDateKey].some(e =>
          e.time === orario && e.size === dimensione && e.qty === bicchieri && e.note === nota
        );
        if (!exists) {
          data[currentDateKey].push({ time: orario, size: dimensione, qty: bicchieri, note: nota });
          imported++;
        } else {
          skipped++;
        }
      });

      saveData();
      render();

      // Reset input per poter reimportare lo stesso file
      event.target.value = '';

      if (imported > 0) {
        showToast(`✅ Importate ${imported} righe!`, 4000);
      } else if (skipped > 0) {
        showToast(`⚠️ Nessuna riga nuova (${skipped} già presenti o non valide)`, 4000);
      } else {
        showToast('⚠️ Nessun dato trovato nel file', 4000);
      }
    } catch(err) {
      showToast('❌ Errore nella lettura del file', 4000);
    }
  };
  reader.readAsArrayBuffer(file);
}

// ── SERVICE WORKER ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// ── INIT ──
loadData();
selectedDate = getTodayKey();
document.getElementById('dateInput').value = selectedDate;
document.getElementById('dateLabel').textContent = formatDate(selectedDate);
document.getElementById('timeInput').value = getNowTime();

// Event listeners - nessun handler inline nell'HTML
document.getElementById('dateInput').addEventListener('change', function(e) { selectDay(e.target.value); });
document.getElementById('sizeSelect').addEventListener('change', updateQtyMl);
document.getElementById('qtyMinus').addEventListener('click', function() { changeQty(-1); });
document.getElementById('qtyPlus').addEventListener('click', function() { changeQty(1); });
document.getElementById('addBtn').addEventListener('click', addEntry);
document.getElementById('toggleBtn').addEventListener('click', toggleHistory);
document.getElementById('exportBtn').addEventListener('click', exportExcel);
document.getElementById('importBtnMain').addEventListener('click', function() { document.getElementById('importFileInput').click(); });
document.getElementById('importBtnOnly').addEventListener('click', function() { document.getElementById('importFileInput').click(); });
document.getElementById('importFileInput').addEventListener('change', importExcel);

// Event delegation per pulsanti delete nella timeline
document.getElementById('timeline').addEventListener('click', function(e) {
  const btn = e.target.closest('.tl-delete');
  if (btn) deleteEntry(parseInt(btn.dataset.index));
});

// Event delegation per click sullo storico
document.getElementById('historyList').addEventListener('click', function(e) {
  const item = e.target.closest('.history-item');
  if (item && item.dataset.date) selectDay(item.dataset.date);
});

updateQtyMl();
render();
</script>
